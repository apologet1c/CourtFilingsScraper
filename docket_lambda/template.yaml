AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: One-shot OSCN eviction docket scraper + case-count report

Parameters:
  BucketName: {Type: String}
  OscnKey: {Type: String, NoEcho: true}
  OscnKeyHeader: {Type: String, Description: "Name of the HTTP header the key goes in"}

Resources:
  DocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oscn-docket-scraper
      CodeUri: .
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          S3_BUCKET: !Ref BucketName
          OSCN_KEY: !Ref OscnKey
          OSCN_KEY_HEADER: !Ref OscnKeyHeader
          OSCN_DB: Tulsa
          REQUEST_DELAY_SECONDS: "1.0"
      Policies:
        - S3CrudPolicy: {BucketName: !Ref BucketName}
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction   # lets a long range continue past 15 min
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:oscn-docket-scraper"
