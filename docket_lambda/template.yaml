AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OSCN eviction docket scraper + report generator

Parameters:
  BucketName: {Type: String}
  JudgeIds: {Type: String, Description: "Comma-separated OSCN Judge= ids for eviction dockets", Default: "1058"}

Resources:
  DocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oscn-docket-scraper
      CodeUri: .
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 512
      ReservedConcurrentExecutions: 1   # one scraper at a time; keeps request rate predictable
      Environment:
        Variables:
          S3_BUCKET: !Ref BucketName
          JUDGE_IDS: !Ref JudgeIds
          OSCN_DB: Tulsa
          CASE_TYPES: SC
          REQUEST_DELAY_SECONDS: "1.0"
          # Fill in whichever matches how your key is issued:
          OSCN_KEY: ""
          OSCN_KEY_HEADER: ""
          OSCN_KEY_PARAM: ""
      Policies:
        - S3CrudPolicy: {BucketName: !Ref BucketName}
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction        # self-continuation for long date ranges
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:oscn-docket-scraper"
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)           # 06:00 UTC: pull recent days + rebuild YTD report
            Input: '{"action": "all", "report_name": "ytd"}'
